name: Weekly data refresh

# Runs the kworb scrape, rebuilds data.json.gz, and commits the result.
#
# Why GitHub Actions rather than Cloudflare: the scrape is ~3,000 requests paced at
# 0.75s, so 40 to 75 minutes wall clock. Every Cloudflare compute product that can be
# put on a cron caps out well below that (Workers cron triggers, Queue consumers and
# Durable Object alarms all stop at 15 minutes; Workers Builds and Pages builds time
# out at 20). Actions allows 6 hours and is free on public repos.
#
# The commit is not incidental: public-repo scheduled workflows are auto-disabled after
# 60 days with no repository activity, so the push is what keeps this job alive.
#
# The commit does NOT publish anything, and it must not. A Cloudflare Workers Builds
# git integration IS connected to this repo (an earlier note here claimed otherwise,
# based on every historical deployment reading Source "Upload"; that was only because
# the repo had been idle since March, so the integration had never fired). It cannot
# publish this site: it only sees the repo, and the generated surface plus data.json.gz
# are deliberately not committed. Leave it disabled in the Cloudflare dashboard.
#
# Publishing happens in the deploy step below, which needs a CLOUDFLARE_API_TOKEN
# secret with the "Edit Cloudflare Workers" permission.

on:
  schedule:
    # 04:10 UTC every Monday. Offset from the hour because scheduled jobs bunch up
    # on the hour and GitHub delays them under load.
    - cron: '10 4 * * 1'
  workflow_dispatch:

# Never let two scrapes overlap; kworb does not deserve double traffic.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Archive the outgoing artifact
        run: |
          mkdir -p snapshots
          if [ -f data.json.gz ]; then
            cp data.json.gz "snapshots/$(date -u +%Y-%m-%d)-previous.json.gz"
          fi

      - name: Scrape kworb
        run: python3 scrape.py

      - name: Clean, dedupe, compress
        run: python3 cleanup.py

      - name: Size gate
        # Workers Static Assets and Pages both cap a single file at 25 MiB
        # (26,214,400 bytes). Deploying over it fails outright, so fail here instead,
        # while the previous artifact is still the live one.
        run: |
          SIZE=$(wc -c < data.json.gz)
          LIMIT=26214400
          echo "data.json.gz = $SIZE bytes ($(( SIZE * 100 / LIMIT ))% of the $LIMIT cap)"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::data.json.gz is $SIZE bytes, at or over the 25 MiB deploy cap."
            exit 1
          fi
          if [ "$SIZE" -gt 24000000 ]; then
            echo "::warning::data.json.gz is within 2 MB of the deploy cap. Split the artifact soon."
          fi

      - name: Sanity-check the dataset
        # A structurally valid but wrong artifact is worse than a failed run, because
        # it would deploy. Check shape and a known-good invariant before committing.
        run: |
          python3 - <<'EOF'
          import gzip, json, sys

          songs = json.load(gzip.open("data.json.gz"))
          print(f"{len(songs):,} songs")

          if len(songs) < 200_000:
              sys.exit(f"FAIL: only {len(songs)} songs, expected 200k+. Scrape likely truncated.")

          required = {"title", "artist", "leads", "features", "totalStreams", "dailyStreams", "url"}
          missing = required - set(songs[0])
          if missing:
              sys.exit(f"FAIL: records are missing {missing}")

          # SD-13: names with commas must survive as single entries, not fragments.
          keys = set()
          for s in songs:
              for n in s["leads"] + s["features"]:
                  keys.add(n.lower())
          if "tyler, the creator" not in keys:
              sys.exit("FAIL: 'Tyler, The Creator' is absent. Artist splitting has regressed.")
          if "tyler" in keys or "the creator" in keys:
              sys.exit("FAIL: comma-split artist fragments are back.")
          print("shape and SD-13 invariants OK")
          EOF

      - name: Build the generated surface
        # Artist pages, per-artist shards, global chart and sitemap. Not committed
        # (~154 MB), so this must run before every deploy.
        run: python3 build_pages.py

      - name: Regenerate the inlined PRELOAD
        # Without this the first-paint rows no longer match the shipped data, the
        # render signature guard stops matching, and the load flash silently returns.
        run: python3 make_preload.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js slugs.json
          if git diff --staged --quiet; then
            echo "Nothing changed; skipping commit."
          else
            git commit -m "chore: weekly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set. The refreshed data was committed but NOT published. Add the secret to enable automatic deploys."
            exit 0
          fi
          npm install --no-save wrangler
          ./deploy.sh
