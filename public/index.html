<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartRank: See Every Song by Any Artist, Ranked by Spotify Streams</title>
  <meta name="description" content="Go beyond the top 10. See every song by any artist ranked by total streams, daily plays, or popularity. Full streaming data for 3,000+ artists.">
  <link rel="canonical" href="https://chartrank.app">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chartrank.app">
  <meta property="og:title" content="ChartRank: See Every Song by Any Artist, Ranked by Spotify Streams">
  <meta property="og:description" content="Go beyond the top 10. See every song by any artist ranked by total streams, daily plays, or popularity. Full streaming data for 3,000+ artists.">
  <meta property="og:image" content="https://chartrank.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ChartRank: every song by any artist, ranked by Spotify streams.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ChartRank: See Every Song by Any Artist, Ranked by Spotify Streams">
  <meta name="twitter:description" content="Go beyond the top 10. See every song by any artist ranked by total streams, daily plays, or popularity. Full streaming data for 3,000+ artists.">
  <meta name="twitter:image" content="https://chartrank.app/og-image.png">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Stamp an explicit theme before first paint so a manual choice does not
       flash the device theme first. Must stay inline and above the stylesheet.
       Safari throws a SecurityError on localStorage over file://, hence the catch. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('chartrank-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
        document.documentElement.dataset.themeChoice = (t === 'light' || t === 'dark') ? t : 'system';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
          <rect x="3"  y="13" width="4.5" height="8"  rx="1.5"/>
          <rect x="9.75" y="8" width="4.5" height="13" rx="1.5"/>
          <rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/>
        </svg>
        <h1>ChartRank</h1>
      </div>

      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="Colour theme: follow device">
        <span id="theme-toggle-icon" aria-hidden="true"></span>
        <span id="theme-toggle-label"></span>
      </button>
    </header>

    <section class="filters">
      <div class="filter-group">
        <label for="artist-input">Search Artist</label>
        <div class="artist-search-wrapper">
          <input type="text" id="artist-input" placeholder="e.g. Billie Eilish, Drake..." autocomplete="off">
          <div id="artist-dropdown" class="artist-dropdown"></div>
        </div>
      </div>

      <a href="#" id="filters-toggle" class="filters-toggle">Filters <span class="toggle-arrow">&#9662;</span></a>
      <div class="filter-row" id="filter-row" style="display:none;">
        <div class="filter-group filter-group-inline">
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="totalStreams-desc" selected>Total Streams</option>
            <option value="dailyStreams-desc">Daily Streams</option>
            <option value="popularity-desc">Popularity (Daily/Total)</option>
          </select>
        </div>
      </div>
    </section>

    <section class="results">
      <div class="results-header">
        <span id="results-count"></span>
      </div>
      <div class="table-wrapper">
        <table id="results-table">
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th class="col-title">Title</th>
              <th class="col-artist">Artist</th>
              <th class="col-streams">Total Streams</th>
              <th class="col-streams">Daily Streams</th>
              <th class="col-preview">Preview</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="mobile-cards"></div>
      <div id="no-results" class="no-results" style="display:none;">No songs found for this artist</div>
      <div class="pagination" id="pagination"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
